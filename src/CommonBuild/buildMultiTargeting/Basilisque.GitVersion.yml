workflow: GitHubFlow/v1
calculation:
  strategies: [Fallback, ConfiguredNextVersion, TaggedCommit]
  ignore:
    tags: ['^[vV]?[0-9]+\.[0-9]+\.[0-9]+-']
  prevent-increment:
    when-current-commit-tagged: false
  branches:
    main:
      label: alpha
    release:
      label: alpha
      mode: ContinuousDelivery
      source-branches: [main, release]
    feature:
      label: 'alpha.feature.{BranchName}'
      mode: ContinuousDelivery
    bugfix:
      regex: '^bugfix(es)?[/-](?<BranchName>.+)$'
      label: 'alpha.bugfix.{BranchName}'
      increment: Inherit
      mode: ContinuousDelivery
      source-branches: [main, release]
      is-source-branch-for: [pull-request]
    pull-request:
      label: 'alpha.pr{Number}'
    unknown:
      label: 'alpha.branch.{BranchName}'
      mode: ContinuousDelivery
output:
  assembly-informational-format: '{SemVer}'
